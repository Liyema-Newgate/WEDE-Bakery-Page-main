<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart - Wendy's Sweet Treats</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body onload="loadCart()">

<header>
    <h1>Your Cart</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="cart.html">Cart</a>
</nav>

<div class="cart-container">
    <h2>Your Items</h2>

    <div id="cart-items"></div>

    <p id="cart-total" class="cart-total"></p>

<button class="btn checkout-btn" id="checkoutBtn">Checkout</button></div>

<!-- Checkout Popup -->
<div id="checkoutPopup">
    <div class="popup-content">
        <h3>Enter Your Details</h3>

        <input id="name" type="text" placeholder="Name"><br><br>
        <input id="surname" type="text" placeholder="Surname"><br><br>
        <input id="address" type="text" placeholder="Address"><br><br>
        <input id="mobile" type="text" placeholder="Mobile Number"><br><br>

<button class="btn confirm-btn" id="confirmOrderBtn">Confirm Order</button>    </div>
</div>

<footer>
    © 2025 Wendy's Sweet Treats
</footer>

</body>
</html>
