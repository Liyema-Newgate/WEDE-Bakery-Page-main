<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="enquiry.html">Enquiry</a>
    </nav>
</header>

<h1 class="page-title">Contact Us</h1>

<section class="form-section">

<form id="contactForm" action="send-email.php" method="POST">

    <label>Name</label>
    <input type="text" id="cname" required minlength="2">

    <label>Email</label>
    <input type="email" id="cemail" required>

    <label>Phone</label>
    <input type="tel" id="cphone" pattern="[0-9]{10}" placeholder="0834567890">

    <label>Message Type</label>
    <select id="cmsgtype" required>
        <option value="">Select</option>
        <option value="General Message">General Message</option>
        <option value="Complaint">Complaint</option>
        <option value="Support">Support Request</option>
    </select>

    <label>Your Full Message</label>
    <textarea id="cmessage" required minlength="10"></textarea>

    <button class="btn checkout-btn" type="submit">Send Message</button>
</form>

<div id="contactResponse"></div>

</section>

<script src="script.js"></script>
</body>
</html>
